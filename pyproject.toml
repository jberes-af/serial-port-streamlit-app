[build-system]
requires = [
    "setuptools>=61",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "serial-port-reader"
version = "0.1.0"
description = "Serial Port Reader Application"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "google-api-python-client>=2.195,<3.0",
    "google-auth-oauthlib==1.3.1",
    "numpy>=2.0,<3.0",
    "openpyxl==3.1.5",
    "pandas>=2.3,<3.0",
    "pyarrow>=17.0,<18.0",
    "protobuf>=5.26.1,<6.0",
    "pyrebase4==4.8.0",
    "python-dotenv==1.2.2",
    "requests>=2.32,<3.0",
    "urllib3==1.26.20",
    "streamlit>=1.56.0,<2.0",
    "streamlit-extras==1.5.0",
    "packaging>=25",
    "markdown==3.10.2",
]


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]
